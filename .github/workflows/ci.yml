name: CI

on:
  push:
    branches: [main]
  pull_request:

# The nightly development job opens a PR per session and merges it when this
# workflow passes. Keep it green: a red main blocks every following session.
jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
