name: CI

on:
  push:
    branches: [main]
  pull_request:

# The nightly development job opens a PR per session and merges it when this
# workflow passes. Keep it green: a red main blocks every following session.
jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sprint_intelligence
          POSTGRES_USER: sprint_intelligence
          POSTGRES_PASSWORD: sprint_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sprint_intelligence -d sprint_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sprint_intelligence:sprint_intelligence@localhost:5432/sprint_intelligence
      RUN_DATABASE_INTEGRATION_TEST: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
