services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sprint_intelligence
      POSTGRES_USER: sprint_intelligence
      POSTGRES_PASSWORD: sprint_intelligence
    ports:
      - "5432:5432"
    volumes:
      - sprint-intelligence-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sprint_intelligence -d sprint_intelligence",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sprint-intelligence-postgres:
